[project]
name = "modal-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafael", email = "rafael.pierre@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
modal-examples = "modal_examples:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "modal>=1.6.1",
    "openai>=3.28.0",
    "ruff>=0.17.0",
]
